<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100d1b">
  <meta name="description" content="SILO — Intelligent Business Management">
  <title>SILO — Intelligent Business Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="dashboard" aria-label="SILO Dashboard">
        <span class="brand-mark">S</span><span class="brand-word">SILO</span>
      </a>
      <div class="workspace-switcher">
        <span class="workspace-avatar">S</span>
        <span><strong id="workspaceName">My Workspace</strong><small>Personal workspace</small></span>
        <span class="switcher-chevron">⌄</span>
      </div>
      <nav class="navigation" aria-label="Main navigation">
        <p class="nav-caption">WORKSPACE</p>
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">◈</span>Dashboard</button>
        <button class="nav-item" data-page="assistant"><span class="nav-icon">✧</span>AI Assistant</button>
        <button class="nav-item" data-page="tasks"><span class="nav-icon">▤</span>Tasks</button>
        <button class="nav-item" data-page="automations"><span class="nav-icon">⟳</span>Automations</button>
        <p class="nav-caption nav-caption-spaced">BUSINESS</p>
        <button class="nav-item" data-page="customers"><span class="nav-icon">♙</span>Customers</button>
        <button class="nav-item" data-page="analytics"><span class="nav-icon">▥</span>Analytics</button>
        <button class="nav-item" data-page="documents"><span class="nav-icon">▧</span>Documents</button>
        <button class="nav-item" data-page="employee"><span class="nav-icon">✦</span>AI Employee <span class="nav-beta">BETA</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
        <div class="sidebar-account"><span class="account-avatar">S</span><span><strong id="accountWorkspace">My Workspace</strong><small>Local account</small></span><span class="account-menu">•••</span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu" id="mobileMenu" aria-label="Toggle navigation">☰</button>
          <div class="system-health"><span class="health-dot"></span><span id="systemStatus">SYSTEM ONLINE</span></div>
        </div>
        <div class="topbar-right">
          <span class="topbar-date" id="todayLabel"></span>
          <button class="icon-button notification-button" id="notificationButton" aria-label="Activity"><span>♧</span><i id="notificationDot" hidden></i></button>
          <button class="profile-chip" data-page="settings"><span class="profile-avatar">S</span><span id="profileName">Workspace</span></button>
        </div>
      </header>
      <div class="page-container">
        <div id="pageRoot" aria-live="polite"></div>
        <footer class="app-footer"><span>SILO © 2026</span><span>INTELLIGENCE THAT GETS WORK DONE.</span><span>LOCAL PREVIEW · 1.0</span></footer>
      </div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="app.js"></script>
</body>
</html>
