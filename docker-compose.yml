services:
  silo:
    build: .
    image: silo:3.0-recovery.12
    container_name: silo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SILO_HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - silo_data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  silo_data:
